# Optional systemd user drop-in for the EXISTING hyprsunset.service.
# Use the separate XDG config directory described in docs/desktop.md.
# Do not add another daemon/autostart command.
# No profiles means no scheduled reset of Putkin's manual choice.
[Service]
Environment=XDG_CONFIG_HOME=%h/.config/putkin/night-light
ExecStart=
ExecStart=/usr/bin/hyprsunset --identity
